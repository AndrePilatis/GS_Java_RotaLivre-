spring.application.name=ms-trechos

spring.profiles.active=dev
spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

server.port=0

eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]}

# a instância renova o registro no Eureka a cada 10 s e sai dele após 30 s sem renovar
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# o Jackson 3 (Spring Boot 4) ordena os atributos do JSON em ordem alfabética;
# assim as respostas seguem a ordem declarada nos DTOs
spring.jackson.mapper.sort-properties-alphabetically=false

# Swagger (via API Gateway): http://localhost:8082/swagger-ui/index.html
# JSON Format: http://localhost:8082/ms-trechos/v3/api-docs
