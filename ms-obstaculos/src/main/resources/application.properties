spring.application.name=ms-obstaculos

spring.profiles.active=dev
spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

server.port=0

eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]}

# a instância renova o registro no Eureka a cada 10 s e sai dele após 30 s sem renovar
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# busca a lista de instâncias do ms-trechos no Eureka a cada 10 s (OpenFeign + Load Balancer)
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.loadbalancer.cache.ttl=10s

# o Jackson 3 (Spring Boot 4) ordena os atributos do JSON em ordem alfabética;
# assim as respostas seguem a ordem declarada nos DTOs
spring.jackson.mapper.sort-properties-alphabetically=false

# Circuit Breaker da comunicação com o ms-trechos (instância atualizarTrecho)

# Define o tamanho da janela deslizante usada para calcular a taxa de falhas.
# Circuit Breaker vai analisar/monitorar as últimas 3 chamadas
# para decidir se deve abrir (parar de tentar) ou fechar (continuar tentando)
resilience4j.circuitbreaker.instances.atualizarTrecho.slidingWindowSize=3

# COUNT_BASED (conta o número de chamadas) - default.
# TIME_BASED - por tempo
resilience4j.circuitbreaker.instances.atualizarTrecho.slidingWindowType=COUNT_BASED

# Número mínimo de chamadas que devem acontecer antes do Circuit Breaker
# começar a calcular a taxa de falhas.
# Aqui só depois de pelo menos 2 chamadas ele começa a avaliar se deve abrir ou não.
resilience4j.circuitbreaker.instances.atualizarTrecho.minimumNumberOfCalls=2

# Tempo que o Circuit Breaker permanece no estado OPEN (aberto)
# antes de tentar voltar para o estado HALF_OPEN (meio aberto)
# e testar se o serviço voltou ao normal.
# Aqui, ele vai esperar 50 segundos antes de tentar novamente.
resilience4j.circuitbreaker.instances.atualizarTrecho.waitDurationInOpenState=50s

# Só as falhas de comunicação com o ms-trechos contam como falha;
# as regras de negócio (404 e 409) não abrem o circuito
resilience4j.circuitbreaker.instances.atualizarTrecho.recordExceptions=feign.FeignException

# Swagger (via API Gateway): http://localhost:8082/swagger-ui/index.html
# JSON Format: http://localhost:8082/ms-obstaculos/v3/api-docs
