name: rotalivre

services:

  # MySQL usado pelos dois microsserviços (cada um cria o próprio database: trechos e obstaculos)
  mysqldb:
    container_name: rotalivre-mysql
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-rotalivre:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - rotalivre-net

  # Os serviços abaixo só sobem com o profile "completo":
  # docker compose --profile completo up -d --build

  eureka-server:
    profiles: ["completo"]
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - rotalivre-net

  api-gateway:
    profiles: ["completo"]
    build: ./api-gateway
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - rotalivre-net
    depends_on:
      - eureka-server

  ms-trechos:
    profiles: ["completo"]
    build: ./ms-trechos
    deploy:
      replicas: 2
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/trechos?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
      - TZ=America/Sao_Paulo
    networks:
      - rotalivre-net
    depends_on:
      mysqldb:
        condition: service_healthy
      eureka-server:
        condition: service_started

  ms-obstaculos:
    profiles: ["completo"]
    build: ./ms-obstaculos
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/obstaculos?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
      - TZ=America/Sao_Paulo
    networks:
      - rotalivre-net
    depends_on:
      mysqldb:
        condition: service_healthy
      eureka-server:
        condition: service_started

networks:
  rotalivre-net:
    driver: bridge

volumes:
  mysql-rotalivre:
